<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かんたん電子契約</title>
<style>
  :root{--bg:#fffaf5;--card:#fff;--ink:#2b2420;--muted:#7a6b62;--line:#f0e2d6;--or:#f26b1d;--or-soft:#fff1e6;--green:#1f8a70;--green-soft:#e8f5f0;--warn:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
  header{background:linear-gradient(135deg,#f26b1d,#ff9a3c);color:#fff;padding:22px 16px;text-align:center}
  header h1{margin:0;font-size:22px} header p{margin:4px 0 0;font-size:13px;opacity:.95}
  main{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:17px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid #e3d3c5;border-radius:8px;font:inherit;background:#fff}
  textarea{min-height:90px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:520px){.row{grid-template-columns:1fr}}
  button{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}
  .primary{background:var(--or);color:#fff;width:100%;font-size:16px;margin-top:8px} .primary:disabled{opacity:.5}
  .ghost{background:var(--or-soft);color:var(--or)}
  .contract{white-space:pre-wrap;background:#fdfbf8;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;max-height:420px;overflow:auto}
  canvas{width:100%;height:170px;border:2px dashed #e3b997;border-radius:10px;background:#fff;touch-action:none;display:block}
  .note{font-size:12px;color:var(--muted)} .err{color:var(--warn);font-weight:600;margin-top:10px;display:none}
  .ok{background:var(--green-soft);border:1px solid #bfe3d7;color:#14614f;border-radius:10px;padding:14px}
  .hide{display:none} .sigimg{height:70px;border-bottom:1px solid #333}
  .chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px} .chk input{width:auto;margin-top:6px}
  code{background:#f6ece2;padding:2px 6px;border-radius:4px;word-break:break-all}
</style>
</head>
<body>
<header><h1>かんたん電子契約</h1><p>契約書を作る → 手書きでサイン → 相手にURLを送る、だけ</p></header>
<main>

<!-- ============ 作成モード（甲） ============ -->
<section id="create">
  <div class="card">
    <h2>① 契約書の種類を選ぶ</h2>
    <p class="note">例えるなら「契約書のひな形帳」から1枚選ぶ作業です。</p>
    <select id="tpl"></select>
    <div id="fields"></div>
  </div>

  <div class="card">
    <h2>② 当事者</h2>
    <div class="row">
      <div><label>甲（あなた）の氏名・会社名</label><input id="aName"></div>
      <div><label>甲のメール</label><input id="aEmail" type="email"></div>
      <div><label>乙（相手）の氏名・会社名</label><input id="bName"></div>
      <div><label>乙のメール（署名URLを送ります）</label><input id="bEmail" type="email"></div>
    </div>
  </div>

  <div class="card">
    <h2>③ 契約書のプレビュー</h2>
    <div class="contract" id="preview"></div>
  </div>

  <div class="card">
    <h2>④ 甲の署名</h2>
    <p class="note">指またはマウスで、下の枠にサインを書いてください。</p>
    <canvas id="padA"></canvas>
    <p><button class="ghost" type="button" onclick="clearPad('A')">書き直す</button></p>
    <label>作成用パスコード（管理者が設定した合言葉）</label>
    <input id="passcode" type="password" autocomplete="off">
    <button class="primary" id="btnCreate" type="button">署名して、乙に署名依頼を送る</button>
    <div class="err" id="errCreate"></div>
  </div>

  <div class="ok hide" id="doneCreate"></div>
</section>

<!-- ============ 署名モード（乙） ============ -->
<section id="sign" class="hide">
  <div class="card">
    <h2 id="sTitle"></h2>
    <p class="note" id="sMeta"></p>
    <div class="contract" id="sBody"></div>
    <p class="note">甲の署名：<br><img id="sSigA" class="sigimg" alt=""></p>
  </div>
  <div class="card" id="signBox">
    <h2>乙の署名</h2>
    <canvas id="padB"></canvas>
    <p><button class="ghost" type="button" onclick="clearPad('B')">書き直す</button></p>
    <label class="chk"><input type="checkbox" id="agree"><span>上記の契約内容を確認し、内容に同意します。</span></label>
    <button class="primary" id="btnSign" type="button">同意して署名する</button>
    <div class="err" id="errSign"></div>
  </div>
  <div class="ok hide" id="doneSign"></div>
</section>
<div class="ok hide" id="fatal"></div>

<p class="note">※本サービスは簡易的な合意記録用です。署名日時・メールアドレス・本文ハッシュを記録し、署名済PDFを保管します。高額・重要な契約は専門家にご相談ください。</p>
</main>

<script>
const CONFIG = {
  // README の手順で発行した Apps Script ウェブアプリURL（index.html と同じもの）
  GAS_URL: "https://script.google.com/macros/s/AKfycbwzgjuZ_AdGByWhWuv4gSnQKBHVK3w96mrUbkED4ReAyFZIO9F-EZW8rECuwYMSxKlV/exec"
};

/* ---------- 契約書テンプレート ---------- */
const today = () => { const d = new Date(); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; };
const TEMPLATES = {
  kamei: {
    name: "業務委託兼ありがとう大学研修契約書【プレミアムプラン】",
    fields: [
      {k:"lump", l:"研修費用（一括払い・税込）", d:"３３０万円"},
      {k:"split", l:"研修費用（分割・クレジット等の総額上限・税込）", d:"３８０万円"},
      {k:"royalty", l:"月額ロイヤリティ（税込）", d:"４８，０００円"},
      {k:"term", l:"契約期間", d:"２年間"}
    ],
    build: (v,a,b) => `${a}（以下、「甲」という。）と${b}（以下、「乙」という。）とは、甲が運営する「ありがとうエアコンお掃除専門店」（以下、「本事業」という。）に関連する業務を乙に委託すること、及び乙の希望によって甲が乙に対して乙の独立をサポート（ボランタリーチェーン契約）することを約したうえ、下記のとおり契約を締結する。

第１条（業務の委託）
甲は、乙に対し、本事業に関して以下の業務（以下、「本件業務」という。）を委託する。
(1) 甲が受注した本件業務の現場作業業務
(2) (1)に関連するサービス利用者との連絡調整業務
(3) 現場作業終了時の作業料受領、クレジットカード決済等の決済に関する業務
(4) その他上記事項に付随する一切の業務

第２条（甲の業務）
甲は本事業を円滑に運営するために、乙に以下を提供する。
(1) 業務管理システム「ありがとう」システムの提供
(2) 本事業に関連する広告、営業集客、受注管理、カスタマーサービス、口コミ日本一を取れるノウハウ、不労所得獲得ノウハウ
(3) 本事業に関連する公正な現場業務の振分け
(4) 請求書自動作成システムの利用
(5) 現場作業に必要な備品を割安で提供すること
(6) 無料求人サイトの利用ノウハウ
(7) 甲の開催するエアコンクリーニングオーナー向けセミナーへの無料参加
(8) 乙が第４条第２項の研修受講料を一括で支払う場合のホームページ制作サポート

第２条の２（プレミアムプラン特典）
甲は、乙がプレミアムプランにて本契約を締結したことに鑑み、前条に定めるサービスに加え、以下の特典を提供する。
(1) 代表・三浦が各地に出向いた際に実施する1対1コンサルティングへの参加権
(2) 年商1億円達成者との1対1コンサルティング
(3) グループコンサルティング（月1回）への参加権
(4) 全国各地で開催される加盟者交流会への参加権（開催ごとに参加可能）
(5) 教育制度の利用権（第20条の2に定める）
(6) 研修センター開設後の利用権
(7) 全研修動画コンテンツの即時視聴権

第３条（必要備品等の用意）
乙は本件業務を開始するにあたって、自己の責任で本件業務に必要な備品等を用意する。
(1) 自動車および自動車の運行・維持に関する諸経費
(2) 本件業務の遂行に必要な道具、洗剤、消耗品等

第４条（業務研修）
１．乙は本件業務を行うにあたり、甲が行う研修を受講しなければならない。
(1) 本契約締結後６か月以内に、甲がインターネット上で提供する３０時間の研修を受講する。
(2) 本契約締結後２週間以内の５０時間の現場研修を受講する。
２．乙は、甲に対し、前項の研修（「ありがとう大学研修」）の受講料として、本契約締結後８日以内に研修費用を支払う。プレミアムプランの研修費用は、一括払いの場合は金${v.lump}（税込）、分割払いの場合は金${v.split}（税込）とする。
３．支払方法は以下のいずれかとする。
(1) 一括払い：金${v.lump}（税込）を甲の指定する銀行口座へ振込む方法により支払う（振込手数料は乙の負担とする）。
(2) 三分割払い：金${v.lump}（税込）を最大３回に分割し、初回３０万円を納めたうえで残余を指定期日内に支払う。
(3) クレジット決済等（テレコムクレジットまたはユニバペイ）利用：総額${v.split}（税込）を上限とし、初回２３０万円をクレジット決済等にて２４回払いとし、完済後に残り１５０万円を一括または再度クレジット決済等を利用して支払うか、乙が選択できる。乙のカード上限額によって満額が難しい場合は、限度額までクレジット決済等を利用し、残金を銀行振込で最大３分割により支払う等、甲乙で別途協議して決定する。
(4) 上記いずれの方法によっても支払が困難である場合、乙は初回３０万円を支払うことを前提に、甲乙協議のうえ最大３５回程度にわたる分割スケジュールを設定し、乙は誠実に支払を継続する。この際、乙は自らの支払能力・資金状況を示す資料等を甲へ提示し、甲がその分割計画を認定した場合に限り履行を認める。もし乙が支払を怠り又は不誠実な対応を繰り返した場合、甲は違約金・損害賠償を請求し得ることを乙は承諾する。
４．クレジット決済等にかかる手数料は乙が負担するものとする。
５．倍速でスタートダッシュを切りたい方で三浦や松本さんの個別コンサルを希望する場合は、別途申し込みをすることができる。その料金や支払条件は、別途甲乙協議のうえ定める。

第５条（顧客からの現金授受の取扱い）
乙が甲の顧客から現金を授受した場合、以下のとおり、甲の指定した口座に振り込む方法によって支払う。
(1) 前月末日から１４日の間に受領した現金については、当月１５日限り
(2) 当月１５日から当月末日の前日までの間に受領した現金については、当月末日限り

第６条（業務委託料）
１．甲は、乙に対し、本契約に基づく業務委託料として、現場ごとの売上の内４５％を本部経費として控除した残額の中から、下記の別表に従い業務委託料を支払う。ただし、閑散期と繁忙期によって歩合が変動する場合がある。
２．前項のほか、閑散期には事務経費として、案件によっては１件９００円を徴収する。

別表＜本部案件の場合＞
適用事項：報酬割合
・自宅から1km未満：70％
・自宅から1km以上〜5km未満：72％
・自宅から5km以上〜10km未満：73％
・自宅から10km以上〜20km未満：75％
・自宅から20km以上〜30km未満：78％
・自宅から30km以上〜50km未満：80％
・自宅から50km以上〜100km未満：85％

（他媒体経由の案件における業務委託料）
乙が「ユアマイスター」経由で依頼を受ける案件については、発注した側・受注した側の業者間で売上を50％：50％で分配する。
乙が「くらしのマーケット」「ミツモア」「おうちにプロ」「自社HP」その他の媒体を通じて案件を紹介・振り分ける場合は、振った側が売上の40％を、現場へ行く側（振られた側）が60％を受け取る形とする。
上記いずれについても、具体的な収益配分は該当媒体の利用規約や甲乙間での事前の合意内容に従う。

第６条の３（店舗間案件紹介仲介料）
１．ありがとうグループ内において、加盟店間で案件の紹介・振り分けが発生した場合、甲は案件を紹介した加盟店および案件を受けた加盟店の双方から、店舗間案件紹介仲介料として、当該案件の売上高の１％をそれぞれ徴収する。
２．前項の仲介料は、以下の方法により支払うものとする。
・案件を紹介した加盟店：当該案件の売上高の１％を甲に支払う
・案件を受けた加盟店：当該案件の売上高の１％を甲に支払う
３．店舗間案件紹介仲介料は、第８条に定める請求書発行時に併せて計算し、業務委託料の精算と同時に処理するものとする。
４．本条の適用は、ありがとうグループ内の加盟店間での案件紹介に限定され、甲から直接委託される案件（本部案件）には適用されない。

第７条（月額ロイヤリティ）
乙は、甲に対し、「ありがとう」システム利用料を含む月額ロイヤリティとして、本契約締結日の翌月より、毎月１５日限り、金${v.royalty}（税込）を甲の指定口座へ振り込む方法によって支払う。振込手数料は乙の負担とする。

第８条（請求書の発行及び委託料の支払い）
１．乙は、毎月末日までに、甲が提供する請求書自動作成システムを利用して、甲に請求書を発行する。
２．甲は、前項の規定により発行された請求金額を、請求のあった翌月末日限りで、乙が指定する預金口座宛に振込送金する。振込手数料は甲が負担する。

第８条の２（PayPal請求に関する特則）
１．甲および乙は、業務委託料その他の業者間請求（以下「本件請求」と総称）において、請求金額が3万円以上となる場合は、原則としてPayPalを用いた請求を行うことを基本ルールとする。
２．前項に定めるPayPal請求にかかる手数料負担については、以下のとおりとする。
(1) 甲が乙にPayPal請求を発行する際の決済手数料は、原則として甲が負担する。
(2) 乙が本件請求を受けた場合、PayPalの案内に従い期限内に支払いを完了しなければならない。
３．乙がPayPalアカウントを所持していない等の理由により、PayPal決済が困難な場合、乙は速やかに甲へ書面またはメール等で通知し、甲乙間で銀行振込その他の方法を別途協議のうえ決定する。
４．乙が前項の協議に応じず、または正当な理由なくPayPal請求に応じない場合、甲は乙に対し支払遅延として違約金・損害賠償を請求しうることを乙は承諾する。
５．その他、本件請求の具体的な方法・手順については、甲が別途定めるガイドラインや通知に従うものとする。

第９条（契約期間）
１．本契約の期間は、本契約締結の日から${v.term}とする。
２．契約満了の２週間前までに、甲または乙から書面による解約申出がない場合、本契約は同一条件にて自動更新されるものとし、以後も同様とする。更新料は徴収しない。
３．甲は、前２項の定めに関わらず、２週間の予告期間をもって本契約を任意に解約することができる。

第１０条（善管注意義務・再委託）
１．乙は、関係諸法令を遵守し、甲と協力の上、甲のために善良なる管理者の注意をもって本契約に基づく業務を遂行する。
２．乙は、甲の書面による承諾がある場合に限り、乙の責任において、委託業務の全部または一部を第三者に行わせることができる。

第１１条（経費の支給）
乙が、本契約に基づく業務遂行のために、第３条に規定する必要備品等以外の経費を必要とする場合は、その都度、甲乙間の協議により、負担者及び支払方法を書面にて決定するものとする。

第１２条（損害賠償）
甲および乙は、故意または過失により、相手方に損害を与えた場合、その損害を賠償するものとする。

第１３条（免責事項）
甲および乙は、火災、震災、水害等の天災による場合、盗難等の第三者による加害またはその他自己の責に帰すことのできない事由により相手方が被った損害について、自己の加入する保険で支払われるものを除き、その責を負わないものとする。

第１４条（契約の解除）
１．甲および乙は、相手方について次の各号に該当する事由が生じた場合、本契約を解除することができる。
(1) 監督官庁から停止または取り消し処分を受けたとき
(2) 破産手続開始、民事再生手続開始、会社再生手続開始、特別清算手続開始の申立てを受け、または自ら申立てを行ったとき
(3) 資産または信用状態に重大な変化が生じ、本契約に基づく債務の履行が困難となるおそれがあると認められるとき
(4) 故意または過失により相手方の信用を失墜させるような行為があったとき
(5) 公序良俗に反し、その他著しい不信の行為があったとき
(6) 本項各号のほか本契約に定める条項に違反し、相手方に対し催告したにもかかわらず当該違反が是正されないとき
２．本条に従い本契約を解除された被解除者は、相手方に対し、契約解除により相手方が被った損害を賠償する。

4. 充電時はタコ足配線又は延長コードの過度な使用を避け、安全なコンセントを使用するものとする。
5. 充電完了後は、充電口カバー及び収納部を確実に閉めるものとする。
6. 長期間使用しない場合も、内蔵電池を保護するため、取扱説明書で推奨される期間を目安として定期的に充電するものとする。
7. 本体は電装品であるため、水洗いしてはならない。

第12条（お手入れ及び保管）
1. 借主は本件機械を衛生的かつ正常な状態に保つため、取扱説明書に従って適切に清掃及び手入れを行うものとする。
2. 電極部に汚れ又は付着物が確認された場合は、取扱説明書に記載された方法によりクエン酸洗浄その他必要な手入れを行うものとする。
3. 電極ユニットプラグ、接続部及び本体内部には水をかけてはならない。
4. 火気の近く、直射日光の当たる場所、炎天下の車内その他高温となる場所で、本件機械を使用、保管又は放置してはならない。
5. 本体を水没させた場合その他水の侵入が疑われる場合は直ちに使用を中止し、貸主へ連絡するものとする。

第13条（故障、修理及び費用負担）
1. 取扱説明書に従った通常の使用方法によって本件機械に故障又は不具合が生じた場合、借主は速やかに貸主へ連絡するものとする。
2. 通常使用に伴う自然故障、経年劣化その他借主の責めに帰することのできない原因による故障については、貸主が修理又は交換等の必要な対応を行う。
3. 次の各号に該当する故障、破損又は性能低下については、借主に故意又は過失がある場合、修理、部品交換又は本体交換に必要となる合理的な実費を借主が負担する。
（1）取扱説明書又は本規約に反する使用
（2）落下、衝撃、本体の水没その他不適切な取扱い
（3）酸性・アルカリ性の入浴剤、硫黄成分を含む水、温泉水その他指定外の水質による使用
（4）分解、改造又は貸主の承諾を受けていない修理
（5）本体又は接続部を濡らした状態での充電
（6）その他借主の故意又は過失による故障又は破損
4. 内蔵電池及び電極ユニットは使用状況、水質、充電回数等により徐々に性能が低下する消耗部品であることを借主は了承する。
5. 通常の使用に伴う消耗又は経年劣化により交換が必要となった場合の費用負担は、貸主が別途定めるメンテナンス条件に従う。
6. 借主の責めに帰することのできない故障により本件機械を使用できない期間が生じた場合のレンタル料金については、使用不能の程度及び期間に応じ、法令及び貸主所定の基準に従い減額、精算その他必要な対応を行う。
7. 修理又は交換を行う場合、製品の状態その他の事情により一定期間を要する場合がある。
8. 初回12ヶ月の契約期間満了後も契約を更新し、2年目の契約期間中に継続して利用する借主は、更新特典として、当該2年目の契約期間中に1回、貸主所定のフルメンテナンスを受けることができる。
9. 前項のフルメンテナンスの具体的な内容、実施方法及び時期は、貸主が別途定めるものとする。なお、故意による破損、水没、紛失、取扱説明書若しくは本規約に反する使用その他通常使用の範囲を超える原因による故障又は損傷は、フルメンテナンスの対象外とし、必要な修理等の費用を借主に負担いただく場合がある。
10. 第8項のフルメンテナンス特典は、2年目の契約期間中に限り利用できるものとし、当該期間の経過後は利用することができない。

第14条（固定用ホルダー等の設置）
1. 借主が固定用ホルダーを壁面等へ設置する場合は、事前に壁面の材質、配管、配線等を確認し、安全に施工可能であることを確認するものとする。
2. 賃貸住宅、宿泊施設その他借主が所有していない建物に穴あけ等を行う場合、借主は事前に所有者又は管理者から必要な承諾を得るものとする。
3. 借主自身又は借主が手配した第三者による施工に起因する壁面等の損傷については、借主の責任において対応する。
4. 貸主又は貸主が指定した施工業者が施工を行った場合における責任については、前項を適用せず、法令及び当該施工契約に従う。

第15条（紛失及び重大な破損）
1. 借主が本件機械又は付属品を紛失した場合、直ちに貸主へ連絡するものとする。
2. 借主の故意又は過失による紛失、修理不能な破損その他本件機械の返却が不可能となった場合、借主は、本件機械の経過使用期間、状態及び残存価値等を考慮した合理的な損害額を負担するものとする。
3. 貸主は、借主に対し、本件機械の新品販売価格を当然に全額請求するものではなく、実際に生じた損害その他法令上認められる範囲で請求するものとする。

第16条（買取り、更新特典及び満了特典）
1. 買取り可能な時期及び買取価格があらかじめ設定されているプランについては、借主は、貸主所定の条件に従い本件機械を買い取ることができる。
2. 借主が契約更新前に買取りを希望する場合は、原則として契約期間満了日の15日前までに貸主へ申し出るものとする。
3. 買取価格その他の条件は、申込時の表示又は貸主が別途提示した買取条件に従う。
4. 買取代金全額の支払いが完了した時点で、本件機械の所有権は借主へ移転し、本件機械に関するレンタル契約は終了する。
5. 初回12ヶ月の契約期間満了後も契約を更新し、2年目の契約期間中に継続して利用する借主には、第13条第8項から第10項に定めるフルメンテナンス特典を付与する。
6. 借主が初回契約期間及び更新後の契約期間を合わせて合計24ヶ月満了まで継続して利用し、当該24ヶ月分のレンタル料金その他本契約に基づく支払債務を全て履行した場合、貸主は満了特典として、借主がその時点で使用している本件機械を借主へ無償で譲渡するものとする。
7. 前項の無償譲渡が完了した時点で、本件機械の所有権は借主へ移転し、本件レンタル契約は終了する。
8. 合計24ヶ月の満了前に中途解約、契約解除その他の理由により本契約が終了した場合、第6項の満了特典は適用されず、本件機械の所有権は借主へ移転しない。
9. 満了特典による本件機械の譲渡は、24ヶ月満了時点において借主が使用している本件機械を現状有姿で引き渡す方法により行うものとし、別途新品への交換を行うものではない。ただし、法令上貸主が負う責任を免除するものではない。

第17条（借主による中途解約）
1. 借主は、契約期間中であっても、貸主所定の方法により中途解約を申し出ることができる。
2. 借主が契約期間満了前に中途解約する場合、借主は、中途解約金として、中途解約日から当該契約期間満了日までの残存期間に相当するレンタル料金を支払うものとする。月払いの場合は残存月数に月額レンタル料金を乗じた額を基準とし、年払いその他の支払方法の場合は、申込時に表示された契約期間及びレンタル料金に基づき残存期間相当額を算定するものとする。
3. 前項にかかわらず、借主が消費者契約法上の消費者に該当する場合その他法令上中途解約金の上限が定められる場合は、当該法令上認められる額を上限とし、これを超える部分については支払義務を負わないものとする。
4. 法令に基づく解除、取消しその他借主に認められた権利については、本条によって制限されない。
5. 借主が合計24ヶ月の満了前に中途解約した場合、第16条第6項に定める満了特典は適用されない。

第18条（貸主による契約解除）
貸主は、借主が次のいずれかに該当し、相当期間を定めて是正を求めても改善されない場合、本契約を解除し、本件機械の返却を求めることができる。ただし、重大な違反により是正を待つことが困難な場合はこの限りでない。
（1）レンタル料金その他の支払いを相当期間滞納した場合
（2）本件機械を無断で転貸又は譲渡した場合
（3）本件機械を故意に破損、改造その他不適切に使用した場合
（4）申込時に重要事項について虚偽の申告をした場合
（5）その他本契約を継続することが困難となる重大な契約違反があった場合

第19条（契約終了及び返却）
1. 契約期間満了、中途解約、解除その他の理由により本契約が終了した場合、借主は契約終了日から3日以内を目安として、貸主が指定する方法により本件機械及び付属品を返却するものとする。
2. 返却時の送料その他の費用については、申込時又は重要事項確認画面に表示された条件に従う。
3. 借主は、返却前に本体及び電極ユニットの水分を除去し、十分に乾燥させたうえで梱包するものとする。
4. 借主が正当な理由なく返却期限を過ぎ、貸主からの催告後も返却しない場合、貸主は返却されるまでの期間について、通常のレンタル料金相当額を上限とする合理的な使用相当損害金を請求することができる。
5. 付属品の欠品又は借主の故意・過失による破損がある場合、貸主はその交換又は修理に必要となる合理的な実費を請求することができる。

第20条（製品の性質及び効果に関する確認）
1. 借主は、本件機械が特定の疾病の診断、治療又は完治を保証するものではないことを確認したうえで使用する。
2. 本件機械による体感、使用感その他の結果には個人差があり、貸主は特定の身体的変化又は成果を保証するものではない。
3. 本条は、製品の欠陥、貸主の故意若しくは重大な過失その他法令上貸主が負う責任を免除するものではない。

第21条（性能及び消耗）
1. 本件機械の水素生成量、稼働時間、充電可能回数その他の性能は、水質、水温、使用環境、使用回数及び経年変化等により変動する場合がある。
2. 内蔵電池は使用及び充電を繰り返すことで徐々に性能が低下する性質を有する。
3. 通常の経年劣化による性能低下は、直ちに故障を意味するものではない。
4. 貸主は、製品として通常期待される使用に支障を及ぼす程度の性能低下が確認された場合、点検、部品交換その他必要な対応を検討する。

第22条（損害賠償）
1. 貸主又は借主が、本契約に違反し、相手方に損害を与えた場合、当該当事者は、自己の責めに帰すべき事由により現実に生じた通常かつ直接の損害について、法令に従い賠償責任を負う。
2. 本規約のいかなる規定も、貸主の故意若しくは重大な過失、製品の欠陥による生命・身体への損害その他法令上免除又は制限することのできない責任を免除するものではない。

第23条（知的財産権）
本契約に関連して貸主から提供される取扱説明書、資料、動画、画像その他のコンテンツに関する著作権その他の知的財産権は、貸主、製造元又は正当な権利者に帰属する。借主は、法令上認められる場合を除き、権利者の承諾なくこれらを複製、改変又は商業利用してはならない。

第24条（個人情報の取扱い）
貸主は、借主から取得した氏名、住所、電話番号、メールアドレス、決済情報その他の個人情報を、商品の発送、料金の請求、契約管理、修理・メンテナンス、アフターサービスその他本契約の履行に必要な範囲及び貸主のプライバシーポリシーに従って取り扱う。

第25条（本規約の変更）
貸主は、法令に従い、変更の必要性、変更内容の相当性その他の事情に照らして合理的な場合、本規約を変更することができる。この場合、貸主は、変更後の規約の内容及び効力発生日を、ウェブサイト、電子メール、LINEその他相当な方法により事前に周知するものとする。

第26条（取扱説明書との関係）
1. 本件機械の安全な使用及び維持管理については、本規約に加えて最新の取扱説明書を適用する。
2. 本規約と取扱説明書の安全上の注意事項に相違がある場合、より安全性を確保する内容を優先する。
3. 借主は、貸主又は製造元から安全上重要な使用方法の変更又は追加の案内があった場合、その内容を確認し遵守するものとする。

第27条（協議及び準拠法）
1. 本規約に定めのない事項又は本規約の解釈について疑義が生じた場合、貸主及び借主は誠意をもって協議し解決する。
2. 本契約には日本法を適用する。
3. 本契約に関して訴訟の必要が生じた場合は、法令上認められる範囲において、貸主の本店所在地を管轄する裁判所を第一審の合意管轄裁判所とする。

  const fit = () => { const r = c.getBoundingClientRect(), ratio = window.devicePixelRatio||1;
    c.width = r.width*ratio; c.height = r.height*ratio; ctx.scale(ratio,ratio);
    ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111"; };
  fit();
  const st = pads[key] = {c, ctx, drawn:false, fit};
  let down = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  c.addEventListener("pointerdown", e => { down = true; c.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); st.drawn = true; });
  c.addEventListener("pointermove", e => { if(!down) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); });
  ["pointerup","pointercancel"].forEach(ev => c.addEventListener(ev, () => down = false));
}
function clearPad(key){ const p = pads[key]; p.ctx.clearRect(0,0,p.c.width,p.c.height); p.drawn = false; }

async function post(data){
  const r = await fetch(CONFIG.GAS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(data)});
  const j = await r.json(); if(!j.ok) throw new Error(j.error || "エラーが発生しました"); return j;
}
const $ = id => document.getElementById(id);
const showErr = (id, m) => { const e = $(id); e.textContent = m; e.style.display = m ? "block" : "none"; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 作成モード ---------- */
function initCreate(){
  const sel = $("tpl");
  sel.innerHTML = Object.entries(TEMPLATES).map(([k,t]) => `<option value="${k}">${t.name}</option>`).join("");
  const render = () => {
    const t = TEMPLATES[sel.value];
    $("fields").innerHTML = t.fields.map(f => {
      const inp = f.t === "textarea" ? `<textarea data-k="${f.k}">${esc(f.d||"")}</textarea>`
        : `<input data-k="${f.k}" type="${f.t||"text"}" value="${esc(f.d||"")}">`;
      return `<label>${f.l}</label>${inp}`;
    }).join("");
    update();
  };
  const values = () => Object.fromEntries([...document.querySelectorAll("#fields [data-k]")].map(e => [e.dataset.k, e.value]));
  const update = () => { $("preview").textContent = TEMPLATES[sel.value].build(values(), $("aName").value||"（甲）", $("bName").value||"（乙）"); };
  sel.addEventListener("change", render);
  document.addEventListener("input", update);
  render();
  initPad("padA","A");

  $("btnCreate").onclick = async () => {
    showErr("errCreate","");
    if(!$("aName").value || !$("bName").value || !$("aEmail").value || !$("bEmail").value) return showErr("errCreate","当事者の氏名とメールを入力してください");
    if(!pads.A.drawn) return showErr("errCreate","甲の署名を書いてください");
    if(!$("passcode").value) return showErr("errCreate","パスコードを入力してください");
    const btn = $("btnCreate"); btn.disabled = true; btn.textContent = "送信中…";
    try{
      const t = TEMPLATES[sel.value];
      const r = await post({
        kind:"contract_create", kind2: sel.value, title: t.name, body: $("preview").textContent,
        aName:$("aName").value, aEmail:$("aEmail").value, bName:$("bName").value, bEmail:$("bEmail").value,
        aSignature: pads.A.c.toDataURL("image/png"), passcode: $("passcode").value,
        signBase: location.origin + location.pathname
      });
      $("doneCreate").innerHTML = `✅ 署名依頼を送りました（契約ID：${esc(r.id)}）。<br>乙が署名すると、署名済みPDFが双方にメールで届きます。<br>
        <span class="note">メールが届かない場合は、次のURLを乙に直接送ってください：</span><br><code>${esc(r.signUrl)}</code>`;
      $("doneCreate").classList.remove("hide"); btn.classList.add("hide"); $("doneCreate").scrollIntoView({behavior:"smooth"});
    }catch(e){ showErr("errCreate", e.message); btn.disabled = false; btn.textContent = "署名して、乙に署名依頼を送る"; }
  };
}

/* ---------- 署名モード ---------- */
async function initSign(id, t){
  $("create").classList.add("hide");
  try{
    const r = await fetch(`${CONFIG.GAS_URL}?action=contract_get&id=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}`);
    const j = await r.json(); if(!j.ok) throw new Error(j.error);
    $("sTitle").textContent = j.title;
    $("sMeta").textContent = `契約ID：${j.id}／作成：${j.createdAt}／甲：${j.aName}／乙：${j.bName}`;
    $("sBody").textContent = j.body; $("sSigA").src = j.aSignature;
    $("sign").classList.remove("hide"); initPad("padB","B");
    $("btnSign").onclick = async () => {
      showErr("errSign","");
      if(!pads.B.drawn) return showErr("errSign","署名を書いてください");
      if(!$("agree").checked) return showErr("errSign","同意にチェックしてください");
      const btn = $("btnSign"); btn.disabled = true; btn.textContent = "署名中…（PDF作成に数十秒かかります）";
      try{
        await post({kind:"contract_sign", id, t, agree:true, bSignature: pads.B.c.toDataURL("image/png"), userAgent: navigator.userAgent});
        $("signBox").classList.add("hide");
        $("doneSign").innerHTML = "✅ 署名が完了しました。署名済みPDFをメールでお送りします。このページは閉じて構いません。";
        $("doneSign").classList.remove("hide");
      }catch(e){ showErr("errSign", e.message); btn.disabled = false; btn.textContent = "同意して署名する"; }
    };
  }catch(e){ $("sign").classList.add("hide"); $("fatal").textContent = "⚠ " + e.message; $("fatal").classList.remove("hide"); }
}

const q = new URLSearchParams(location.search);
if(q.get("id") && q.get("t")) initSign(q.get("id"), q.get("t")); else initCreate();
</script>
