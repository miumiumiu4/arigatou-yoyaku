<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電子契約</title>
<style>
  :root{--bg:#fffaf5;--card:#fff;--ink:#2b2420;--muted:#7a6b62;--line:#f0e2d6;--or:#f26b1d;--or-soft:#fff1e6;--green:#1f8a70;--green-soft:#e8f5f0;--warn:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
  header{background:linear-gradient(135deg,#f26b1d,#ff9a3c);color:#fff;padding:22px 16px;text-align:center}
  header h1{margin:0;font-size:22px} header p{margin:4px 0 0;font-size:13px;opacity:.95}
  main{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:17px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid #e3d3c5;border-radius:8px;font:inherit;background:#fff}
  textarea{min-height:90px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:520px){.row{grid-template-columns:1fr}}
  button{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}
  .primary{background:var(--or);color:#fff;width:100%;font-size:16px;margin-top:8px} .primary:disabled{opacity:.5}
  .ghost{background:var(--or-soft);color:var(--or)}
  .contract{white-space:pre-wrap;background:#fdfbf8;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;max-height:420px;overflow:auto}
  canvas{width:100%;height:170px;border:2px dashed #e3b997;border-radius:10px;background:#fff;touch-action:none;display:block}
  .note{font-size:12px;color:var(--muted)} .err{color:var(--warn);font-weight:600;margin-top:10px;display:none}
  .ok{background:var(--green-soft);border:1px solid #bfe3d7;color:#14614f;border-radius:10px;padding:14px}
  .hide{display:none} .sigimg{height:70px;border-bottom:1px solid #333}
  .chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px} .chk input{width:auto;margin-top:6px}
  code{background:#f6ece2;padding:2px 6px;border-radius:4px;word-break:break-all}
</style>
</head>
<body>
<header><h1>電子契約</h1></header>
<main>

<!-- ============ 合言葉（甲だけが入れる入口） ============ -->
<section id="login" class="hide">
  <div class="card">
    <h2>合言葉を入れてください</h2>
    <p class="note">契約書を作る人専用のページです。合言葉が合うと、契約書の種類を選べます。</p>
    <input id="loginPass" type="password" autocomplete="off">
    <button class="primary" id="btnLogin" type="button">開く</button>
    <div class="err" id="errLogin"></div>
  </div>
</section>

<!-- ============ 作成モード（甲） ============ -->
<section id="create" class="hide">
  <div class="card">
    <h2>① 契約書の種類を選ぶ</h2>
    <p class="note">例えるなら「契約書のひな形帳」から1枚選ぶ作業です。</p>
    <select id="tpl"></select>
    <div id="fields"></div>
  </div>

  <div class="card">
    <h2>② 当事者</h2>
    <div class="row">
      <div><label>甲（あなた）の氏名・会社名</label><input id="aName"></div>
      <div><label>甲のメール</label><input id="aEmail" type="email"></div>
      <div><label>乙（相手）の氏名・会社名</label><input id="bName"></div>
      <div><label>乙のメール（署名URLを送ります）</label><input id="bEmail" type="email"></div>
    </div>
  </div>

  <div class="card">
    <h2>③ 契約書のプレビュー</h2>
    <div class="contract" id="preview"></div>
  </div>

  <div class="card">
    <h2>④ 甲の署名</h2>
    <p class="note">指またはマウスで、下の枠にサインを書いてください。</p>
    <canvas id="padA"></canvas>
    <p><button class="ghost" type="button" onclick="clearPad('A')">書き直す</button></p>
    <button class="primary" id="btnCreate" type="button">署名して、相手に送るリンクを作る</button>
    <div class="err" id="errCreate"></div>
  </div>

  <div class="ok hide" id="doneCreate"></div>
</section>

<!-- ============ 署名モード（乙） ============ -->
<section id="sign" class="hide">
  <div class="card">
    <h2 id="sTitle"></h2>
    <p class="note" id="sMeta"></p>
    <div class="contract" id="sBody"></div>
    <p class="note">甲の署名：<br><img id="sSigA" class="sigimg" alt=""></p>
  </div>
  <div class="card" id="signBox">
    <h2>乙の署名</h2>
    <canvas id="padB"></canvas>
    <p><button class="ghost" type="button" onclick="clearPad('B')">書き直す</button></p>
    <label class="chk"><input type="checkbox" id="agree"><span>上記の契約内容を確認し、内容に同意します。</span></label>
    <button class="primary" id="btnSign" type="button">同意して署名する</button>
    <div class="err" id="errSign"></div>
  </div>
  <div class="ok hide" id="doneSign"></div>
</section>
<div class="ok hide" id="fatal"></div>

<p class="note">※本サービスは簡易的な合意記録用です。署名日時・メールアドレス・本文ハッシュを記録し、署名済PDFを保管します。高額・重要な契約は専門家にご相談ください。</p>
</main>

<script>
const CONFIG = {
  // README の手順で発行した Apps Script ウェブアプリURL（index.html と同じもの）
  GAS_URL: "https://script.google.com/macros/s/AKfycbwzgjuZ_AdGByWhWuv4gSnQKBHVK3w96mrUbkED4ReAyFZIO9F-EZW8rECuwYMSxKlV/exec"
};

/* ---------- 契約書テンプレート（合言葉が合ったときだけ Apps Script から受け取る） ---------- */
const today = () => { const d = new Date(); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; };
let TEMPLATES = {}, PASS = "";
const yen = x => Number(x||0).toLocaleString();
function fill(body, v, a, b){
  return body.replace(/\{\{(\w+)(?:\|(\w+))?\}\}/g, (_, k, f) => {
    const x = k === "a" ? a : k === "b" ? b : k === "today" ? today() : (v[k] ?? "");
    if (f === "yen") return yen(x);
    if (f === "yenblank") return x ? yen(x) : "　　　　";
    if (f === "blank") return x || "　　";
    return x;
  });
}

/* ---------- 共通：署名パッド ---------- */
const pads = {};
function initPad(id, key){
  const c = document.getElementById(id), ctx = c.getContext("2d");
  const fit = () => { const r = c.getBoundingClientRect(), ratio = window.devicePixelRatio||1;
    c.width = r.width*ratio; c.height = r.height*ratio; ctx.scale(ratio,ratio);
    ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111"; };
  fit();
  const st = pads[key] = {c, ctx, drawn:false, fit};
  let down = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  c.addEventListener("pointerdown", e => { down = true; c.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); st.drawn = true; });
  c.addEventListener("pointermove", e => { if(!down) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); });
  ["pointerup","pointercancel"].forEach(ev => c.addEventListener(ev, () => down = false));
}
function clearPad(key){ const p = pads[key]; p.ctx.clearRect(0,0,p.c.width,p.c.height); p.drawn = false; }

async function post(data){
  const r = await fetch(CONFIG.GAS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(data)});
  const j = await r.json(); if(!j.ok) throw new Error(j.error || "エラーが発生しました"); return j;
}
const $ = id => document.getElementById(id);
const showErr = (id, m) => { const e = $(id); e.textContent = m; e.style.display = m ? "block" : "none"; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 入口（合言葉） ---------- */
function initLogin(){
  $("login").classList.remove("hide");
  const go = async () => {
    showErr("errLogin","");
    const pass = $("loginPass").value;
    if(!pass) return showErr("errLogin","合言葉を入力してください");
    const btn = $("btnLogin"); btn.disabled = true; btn.textContent = "確認中…";
    try{
      const r = await post({kind:"contract_templates", passcode: pass});
      if(!r.templates) throw new Error("受付側（Apps Script）がまだ新しい版になっていません");
      TEMPLATES = r.templates; PASS = pass;
      $("login").classList.add("hide"); $("create").classList.remove("hide");
      initCreate();
    }catch(e){ showErr("errLogin", e.message.replace(/^Error:\s*/,"")); btn.disabled = false; btn.textContent = "開く"; }
  };
  $("btnLogin").onclick = go;
  $("loginPass").addEventListener("keydown", e => { if(e.key === "Enter") go(); });
}

/* ---------- 作成モード ---------- */
function initCreate(){
  const sel = $("tpl");
  sel.innerHTML = Object.entries(TEMPLATES).map(([k,t]) => `<option value="${k}">${t.name}</option>`).join("");
  const render = () => {
    const t = TEMPLATES[sel.value];
    $("fields").innerHTML = t.fields.map(f => {
      const inp = f.t === "textarea" ? `<textarea data-k="${f.k}">${esc(f.d||"")}</textarea>`
        : `<input data-k="${f.k}" type="${f.t||"text"}" value="${esc(f.d||"")}">`;
      return `<label>${f.l}</label>${inp}`;
    }).join("");
    update();
  };
  const values = () => Object.fromEntries([...document.querySelectorAll("#fields [data-k]")].map(e => [e.dataset.k, e.value]));
  const update = () => { $("preview").textContent = fill(TEMPLATES[sel.value].body, values(), $("aName").value||"（甲）", $("bName").value||"（乙）"); };
  sel.addEventListener("change", render);
  document.addEventListener("input", update);
  render();
  initPad("padA","A");

  $("btnCreate").onclick = async () => {
    showErr("errCreate","");
    if(!$("aName").value || !$("bName").value || !$("aEmail").value || !$("bEmail").value) return showErr("errCreate","当事者の氏名とメールを入力してください");
    if(!pads.A.drawn) return showErr("errCreate","甲の署名を書いてください");
    const btn = $("btnCreate"); btn.disabled = true; btn.textContent = "送信中…";
    try{
      const t = TEMPLATES[sel.value];
      const r = await post({
        kind:"contract_create", kind2: sel.value, title: t.name, body: $("preview").textContent,
        aName:$("aName").value, aEmail:$("aEmail").value, bName:$("bName").value, bEmail:$("bEmail").value,
        aSignature: pads.A.c.toDataURL("image/png"), passcode: PASS,
        signBase: location.origin + location.pathname
      });
      $("doneCreate").innerHTML = `✅ 契約書ができました（契約ID：${esc(r.id)}）。<br>
        <b>下のリンクを相手に送ってください。</b>相手はこのリンクから、この契約書だけを見て署名できます。<br>
        <code id="signLink">${esc(r.signUrl)}</code><br>
        <button class="ghost" type="button" id="btnCopy" style="margin-top:8px">リンクをコピー</button><br>
        <span class="note">同じリンクは相手のメールにも自動で送っています。相手が署名すると、署名済みPDFが双方にメールで届きます。</span>`;
      $("btnCopy").onclick = async () => { try{ await navigator.clipboard.writeText(r.signUrl); $("btnCopy").textContent = "コピーしました"; }catch(_){ $("btnCopy").textContent = "長押しでコピーしてください"; } };
      $("doneCreate").classList.remove("hide"); btn.classList.add("hide"); $("doneCreate").scrollIntoView({behavior:"smooth"});
    }catch(e){ showErr("errCreate", e.message); btn.disabled = false; btn.textContent = "署名して、相手に送るリンクを作る"; }
  };
}

/* ---------- 署名モード ---------- */
async function initSign(id, t){
  try{
    const r = await fetch(`${CONFIG.GAS_URL}?action=contract_get&id=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}`);
    const j = await r.json(); if(!j.ok) throw new Error(j.error);
    $("sTitle").textContent = j.title;
    $("sMeta").textContent = `契約ID：${j.id}／作成：${j.createdAt}／甲：${j.aName}／乙：${j.bName}`;
    $("sBody").textContent = j.body; $("sSigA").src = j.aSignature;
    $("sign").classList.remove("hide"); initPad("padB","B");
    $("btnSign").onclick = async () => {
      showErr("errSign","");
      if(!pads.B.drawn) return showErr("errSign","署名を書いてください");
      if(!$("agree").checked) return showErr("errSign","同意にチェックしてください");
      const btn = $("btnSign"); btn.disabled = true; btn.textContent = "署名中…（PDF作成に数十秒かかります）";
      try{
        await post({kind:"contract_sign", id, t, agree:true, bSignature: pads.B.c.toDataURL("image/png"), userAgent: navigator.userAgent});
        $("signBox").classList.add("hide");
        $("doneSign").innerHTML = "✅ 署名が完了しました。署名済みPDFをメールでお送りします。このページは閉じて構いません。";
        $("doneSign").classList.remove("hide");
      }catch(e){ showErr("errSign", e.message); btn.disabled = false; btn.textContent = "同意して署名する"; }
    };
  }catch(e){ $("sign").classList.add("hide"); $("fatal").textContent = "⚠ " + e.message; $("fatal").classList.remove("hide"); }
}

const q = new URLSearchParams(location.search);
if(q.get("id") && q.get("t")) initSign(q.get("id"), q.get("t")); else initLogin();
</script>
</body>
</html>
